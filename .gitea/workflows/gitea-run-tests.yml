---
name: On push to branch and pull request to master run tests
on:
  push:
    branches:
      - "!master"
  pull_request:
    branches:
      - master
      - develop
jobs:
  run_tests_and_add_coverage_to_pull_request:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          server-id: gitea-deploy
          settings-path: ${{ gitea.workspace }}
      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.6
      - name: Build with Maven
        run: mvn -s ./.gitea/workflows/settings.xml jacoco:check package --file pom.xml
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          OWNER: ${{ gitea.repository_owner }}
          REPO_NAME: ${{ gitea.event.repository.name }}
      - name: Add coverage to pull request
        uses: madrapps/jacoco-report@v1.3
        with:
          paths: ./target/site/jacoco/jacoco.xml
          token: ${{ secrets.ACCESS_TOKEN }}
          min-coverage-overall: 50
          title: Coverage
          update-comment: true
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          OWNER: ${{ gitea.repository_owner }}
          REPO_NAME: ${{ gitea.event.repository.name }}
