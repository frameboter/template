name: nightly

on:
  release:
    types: [created]
  push:
    branches:
      - develop

jobs:
  build:
    name: Build & Deploy Spring Boot App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: gitea-deploy
          settings-path: ${{ github.workspace }}

      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.6

      - name: Build with Maven
        run: mvn -B clean install -s ./.gitea/workflows/settings.xml --file pom.xml
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          OWNER: ${{ gitea.repository_owner }}
          REPO_NAME: ${{ gitea.event.repository.name }}


      - name: Deploy OpenAPI Client to Gitea Maven Repo
        run: mvn deploy --file target/generated-sources/java/pom.xml -DaltDeploymentRepository=gitea-deploy::default::https://gitea.roboter5123.com/api/packages/${{ gitea.repository_owner }}/maven -s ./.gitea/workflows/settings.xml
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}

      - name: Publish to Gitea Maven Repository
        run: mvn deploy -s ./.gitea/workflows/settings.xml
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          OWNER: ${{ gitea.repository_owner }}
          REPO_NAME: ${{ gitea.event.repository.name }}

      - name: Build & Push Docker Image
        uses: mr-smithers-excellent/docker-build-push@v5
        with:
          image: ${{ gitea.repository_owner }}/${{ gitea.event.repository.name }}
          tags: nightly
          registry: gitea.roboter5123.com
          dockerfile: Dockerfile
          username: ${{ gitea.repository_owner }}
          password: ${{ secrets.ACCESS_TOKEN }}
